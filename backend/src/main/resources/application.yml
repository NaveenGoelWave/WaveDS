server:
  port: 8080

spring:
  application:
    name: wave-ds
  datasource:
    # Defaults match docker-compose.yml / .env for local development.
    # In any shared or production environment, override with environment variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wave_ds}
    username: ${DB_USERNAME:wave_user}
    password: ${DB_PASSWORD:ChangeMe_Local123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always

app:
  auth:
    # HS256 signing key, at least 32 characters. The default below is for local development ONLY.
    # In any shared or production environment, set the JWT_SECRET environment variable.
    jwt-secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
    # When false, new accounts cannot be created (except the very first one, who becomes ADMIN).
    signup-enabled: ${SIGNUP_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
