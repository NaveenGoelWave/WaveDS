server:
  port: 8080

spring:
  application:
    name: wave-ds
  datasource:
    # Defaults match docker-compose.yml / .env for local development.
    # In any shared or production environment, override with environment variables.
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wave_ds}
    username: ${DB_USERNAME:wave_user}
    password: ${DB_PASSWORD:ChangeMe_Local123}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
